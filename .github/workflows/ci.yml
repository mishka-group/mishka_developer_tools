name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Switch to @ci-v1 once mishka-group/mishka_cms#77 is merged and tagged.
    uses: mishka-group/mishka_cms/.github/workflows/mishka-ci.yml@ci/shared-workflows
    with:
      # Today CI only runs the tests on the oldest pair; there is no .tool-versions.
      elixir: 1.17.1
      otp: "27.0"
      credo: false
      dialyzer: false
      ex_dna: false
      mix-audit: false
      # Off as on master: mix hex.audit reports html_sanitize_ex 1.4.3 and jose 1.11.12 advisories
      # that need dependency upgrades of their own.
      hex-audit: false
      test-args: --trace
